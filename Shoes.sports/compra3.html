<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoes Shop</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #056160;
            margin: 0;
        }

        header {
            background: #25a9c0;
            color: white;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin: 0;
        }

        .card {
            background: #25a9c0;
            width: 200px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            padding: 15px;
            transition: 0.3s;
            margin: 20px auto; 
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        .nome {
            font-weight: bold;
            margin: 20px 0;
        }

        .preco {
            color: rgb(0, 0, 0);
            font-size: 18px;
            margin-bottom: 10px;
        }
        </style>
</head>
<body>
    <div class="card">
    <img src="shopping (2).webp" alt="Tênis 3">
        <div class="nome">Tênis Running</div>
        <div class="nome">ZoomX Streakfly</div>
        <div class="preco">R$ 759,99</div>
    
</body>
</html>
