<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Shoes Shop</title>

<style>
    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #056160;
        margin: 0;
    }

    header {
        background: #25a9c0;
        color: white;
        text-align: center;
        padding: 20px;
    }

    h1 {
        margin: 0;
    }

    .catalogo {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        padding: 20px;
        gap: 20px;
    }

    .card {
        background:#25a9c0;
        width: 200px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        text-align: center;
        padding: 15px;
        transition: 0.3s;
    }

    .card:hover {
        transform: scale(1.05);
    }

    .card img {
        width: 100%;
        border-radius: 10px;
    }

    .nome {
        font-weight: bold;
        margin: 20px 0;
    }

    .preco {
        color: rgb(0, 0, 0);
        font-size: 18px;
        margin-bottom: 10px;
    }

    button {
        background: #111;
        color: rgb(255, 255, 255);
        border: none;
        padding: 10px;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #444;
    }

    a.Comprar {
        display: inline-block;
        background-color: #111;
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-weight: bold;
        transition: background-color 0.3s ease;
    }

    a.Comprar:hover {
        background-color: #444;
        color: #fff;
        }
</style>
</head>

<body>

<header>
    <h1>Catálogo Shoes Shop</h1>
</header>

<section class="catalogo">

    <div class="card">
        <img src="shopping.webp" alt="Tênis 1">
        <div class="nome">Tênis Esportivo</div>
        <div class="preco">R$ 359,99</div>
        <a href="compra.html" class="Comprar">Compra</a>
    </div>

    <div class="card">
        <img src="shopping (1).webp" alt="Tênis 2">
        <div class="nome">Tênis Casual</div>
        <div class="preco">R$ 429,99</div>
        <a href="compra2.html" class="Comprar">Compra</a>
    </div>

    <div class="card">
        <img src="shopping (2).webp" alt="Tênis 3">
        <div class="nome">Tênis Running</div>
        <div class="preco">R$ 759,99</div>
        <a href="compra3.html" class="Comprar">Compra</a>
    </div>

</section>

</body>
</html>
